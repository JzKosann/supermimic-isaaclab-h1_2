[tool.ruff]
line-length = 200
target-version = "py310"
extend-exclude = ["logs", "datasets", "assets", "_isaac_sim"]

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"source/supermimic_h1_2/supermimic_h1_2/mdp/__init__.py" = ["F401"]  # re-exports used by the env config
"scripts/*.py" = ["E402"]  # Isaac Lab scripts must start AppLauncher before importing
"scripts/supermimic/*.py" = ["E402"]
