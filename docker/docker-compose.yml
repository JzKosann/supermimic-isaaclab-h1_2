# Usage (inside docker/):
#   docker compose build
#   docker compose run --rm prepare-data                                          # download the model / data and convert to npz (once)
#   GPU=0 TASK=Tracking-Flat-H1_2-SuperMimic-v1 RUN_NAME=lafan1_v1 docker compose up -d train
#   resume: GPU=0 RESUME=/workspace/supermimic/logs/supermimic/<run>/ckpt_latest.pt docker compose up -d train
#   evaluate: GPU=0 CKPT=/workspace/supermimic/logs/supermimic/<run> docker compose run --rm eval
#   wandb: WANDB_API_KEY=... LOGGER=wandb docker compose up -d train
# Logs end up on the host in ../logs/supermimic/<date>_<RUN_NAME>/.

x-base: &base
  image: supermimic-h1_2:latest
  build:
    context: ..
    dockerfile: docker/Dockerfile
  volumes:
    - ../logs:/workspace/supermimic/logs
    - ../datasets:/workspace/supermimic/datasets
    - ../assets/unitree_model:/workspace/supermimic/assets/unitree_model
    # mount the source: Python changes need no image rebuild (the editable install reads the mounted files)
    - ../source:/workspace/supermimic/source
    - ../scripts:/workspace/supermimic/scripts
  working_dir: /workspace/supermimic
  environment:
    - ACCEPT_EULA=Y
    - PRIVACY_CONSENT=Y
    - WANDB_API_KEY=${WANDB_API_KEY:-}
    - WANDB_MODE=${WANDB_MODE:-online}
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${GPU:-0}"]
            capabilities: [gpu]

services:
  prepare-data:
    <<: *base
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /isaac-sim/python.sh scripts/download_assets.py && /isaac-sim/python.sh scripts/csv_to_npz.py --headless

  train:
    <<: *base
    container_name: supermimic-train-gpu${GPU:-0}
    command: >-
      scripts/supermimic/train.py
      --task ${TASK:-Tracking-Flat-H1_2-SuperMimic-v1}
      --headless
      --num_envs ${NUM_ENVS:-4096}
      --seed ${SEED:-0}
      --run_name ${RUN_NAME:-lafan1}
      --logger ${LOGGER:-tensorboard}
      ${RESUME:+--resume ${RESUME}}
      ${EXTRA_ARGS:-}

  eval:
    <<: *base
    command: >-
      scripts/supermimic/eval_benchmark.py
      --headless
      --ckpt ${CKPT:-logs/supermimic}
      ${EXTRA_ARGS:-}
